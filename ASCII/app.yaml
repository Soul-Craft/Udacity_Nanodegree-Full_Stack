# Python 3.14 is App Engine's newest Python runtime (CI tests on 3.15).
runtime: python314
entrypoint: gunicorn -b :$PORT ascii:app
# Bundled services (datastore, users) through appengine-python-standard.
app_engine_apis: true

handlers:
- url: /stylesheets
  static_dir: stylesheets
- url: /.*
  script: auto
