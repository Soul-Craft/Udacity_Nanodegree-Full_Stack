# Python 3.14 is App Engine's newest Python runtime (CI tests on 3.15).
runtime: python314
entrypoint: gunicorn -b :$PORT guestbook:app
# Bundled services (datastore, users) through appengine-python-standard.
app_engine_apis: true

# [START handlers]
handlers:
- url: /favicon\.ico
  static_files: favicon.ico
  upload: favicon\.ico

- url: /bootstrap
  static_dir: bootstrap

- url: /.*
  script: auto
# [END handlers]
